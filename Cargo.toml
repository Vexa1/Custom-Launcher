[package]
name = "creblox"
version = "0.5.48"
edition = "2024"
license = "GPL-3.0-only"
description = "CREBLOX — a fast native Roblox launcher with an in-game HUD overlay for macOS"

[dependencies]
# OpenGL (glow) is the most compatible backend on older Intel Macs; wgpu is
# deliberately not compiled in.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
] }
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
# Global allocator: egui builds and throws away thousands of small buffers every
# frame, and mimalloc serves those noticeably faster than the system malloc while
# keeping RSS lower. Pure C, no extra runtime requirement on macOS 10.15.
mimalloc = { version = "0.1", default-features = false }
flate2 = "1.0"
image = { version = "0.25.10", features = ["png"] }
open = "5.4.5"
serde_json = "1.0.154"
# Party: the host is a WebSocket server and every member a client, all on one blocking
# thread. Plain TCP only (peers are on the local network or a forwarded port), so this adds
# a WebSocket codec and no TLS stack, and no async runtime.
serde = { version = "1", features = ["derive"] }
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
] }
# Party host: ask the router for a port so friends can dial in. Synchronous UPnP client
# (`io_sync`, attohttpc) - deliberately not the tokio flavour, which would drag an async
# runtime into a blocking app.
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
# gzip: Roblox JSON responses are highly compressible; this cuts transfer size and
# therefore latency on every API call (profiles, servers, feeds) with no API change.
ureq = { version = "2", features = ["json", "gzip"] }
matroska-demuxer = "0.8.1"
vp8-decoder = "0.1.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


# The Windows self-update unzips a release zip in pure Rust: no PowerShell, no external
# unzip, and no extra runtime for the user to install.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
aes-gcm = "0.10"
getrandom = "0.2"
tray-icon = "0.26"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Speed / size trade-offs, all safe on macOS 10.15.7 (no new runtime requirements):
#  * opt-level 3 + thin LTO: full inlining across crates without the multi-minute
#    build cost of fat LTO.
#  * codegen-units 1 for dependencies: best code, and their artifacts stay cached.
#  * debug = false + strip: no debug info in the shipped binary (smaller, less paging).
#  * panic stays "unwind": aborting would change what happens after a panic.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
# Rebuild only what changed. Dependencies keep the exact settings above, so their
# cached build artifacts stay valid; only the CREBLOX crate itself is built
# incrementally (and in parallel), which turns minutes-long rebuilds into seconds.
incremental = true

[profile.release.package.creblox]
codegen-units = 16
