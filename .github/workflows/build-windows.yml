name: build-windows

# The Windows x64 launcher, built the way users get it: one double-clickable exe with the GUI
# subsystem, so no console window ever appears. Pushing a v* tag also attaches
# CREBLOX-<version>-windows-x64.zip to that release, which is what the in-app Windows
# self-update downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the zip to this existing tag's release (leave empty to only build)"
        required: false
        type: string

# Needed to upload an asset to the release; nothing else in the job writes to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      # The launcher's own #[cfg(test)] suites (release parsing, updater, auth, FastFlags,
      # theme) run here too, on the platform whose self-update they install. `--bins` keeps it
      # to the binary's unit tests; the vm-tests harness below covers the rest.
      - name: Unit tests
        run: cargo test --locked --bins

      # The updater's Windows half only ever runs on Windows, so exercise it here: the vm-tests
      # compile the real `src/zip_update.rs` and `src/release_links.rs`, and
      # `the_built_launcher_passes_its_own_check` reads CREBLOX_LAUNCHER, which is the exe this
      # job just built. A PE change that would wedge an in-app update fails on the build, not on
      # a user's machine.
      - name: Test the update reader
        env:
          CREBLOX_LAUNCHER: ${{ github.workspace }}\target\release\creblox.exe
        run: cargo test --locked --manifest-path vm-tests/Cargo.toml --test update_zip

      - name: Verify the executable
        shell: pwsh
        run: |
          $exe = "target/release/creblox.exe"
          if (-not (Test-Path $exe)) { throw "creblox.exe was not produced" }

          # The PE optional header's Subsystem must be 2 (Windows GUI): that is what stops
          # a black console from flashing up when the exe is double-clicked.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x18 + 0x44)
          if ($subsystem -ne 2) { throw "expected the GUI subsystem (2), found $subsystem" }

          # Windows has to be able to start the image: it is a valid PE and its imports resolve.
          # The window itself cannot open on a runner (no GPU), so an exit here is reported but
          # not fatal; the PE checks above are the hard gate.
          $proc = Start-Process -FilePath $exe -ArgumentList "--tray" -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) {
            "creblox.exe started and exited with code $($proc.ExitCode) (no GPU on this runner)"
          } else {
            "creblox.exe stayed up for 5 s"
            Stop-Process -Id $proc.Id -Force
          }

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "CREBLOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/creblox.exe dist/creblox.exe
          $zip = "CREBLOX-$env:CREBLOX_VERSION-windows-x64.zip"
          Compress-Archive -Path dist/creblox.exe -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object { "sha256 $($_.Hash)" }

      - name: Attach the zips to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $version = $env:CREBLOX_VERSION
          # A zip named for a different version would be invisible to the updater's release
          # check, so stop instead of publishing a file nobody can find.
          if ($tag -ne "v$version") {
            throw "tag $tag does not match Cargo.toml version $version - bump the version or retag"
          }

          # The published macOS overlay goes up first and is listed first: clients that shipped
          # before the platform check take the first zip asset they find, and that must be the
          # archive they can actually install.
          $mac = "release/CREBLOX-$version-update.zip"
          if (-not (Test-Path $mac)) { throw "$mac is missing; publish the macOS archives first" }
          $win = "CREBLOX-$version-windows-x64.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "CREBLOX $version" --notes "CREBLOX $version release."
            if ($LASTEXITCODE -ne 0) { throw "could not create the release for $tag" }
          }

          gh release upload $tag $mac --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload $mac to $tag" }
          gh release upload $tag $win --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload $win to $tag" }

          # The in-app updater reads the release notes to find each download and the SHA-256 it
          # must match. Add a line per asset, once, keeping the existing notes intact.
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $macUrl = "$base/CREBLOX-$version-update.zip"
          $winUrl = "$base/$win"
          $body = (gh release view $tag --json body -q .body) -join "`n"
          if ($body -match [regex]::Escape($winUrl)) {
            "note: $win is already listed in the release notes"
            exit 0
          }
          $macHash = (Get-FileHash $mac -Algorithm SHA256).Hash.ToLowerInvariant()
          $winHash = (Get-FileHash $win -Algorithm SHA256).Hash.ToLowerInvariant()
          $entry = "macOS update (release asset): $macUrl`nsha256 $macHash`n" +
                   "Windows x64: $winUrl`nsha256 $winHash"
          $notes = if ([string]::IsNullOrWhiteSpace($body)) { $entry } else { "$body`n`n$entry" }
          $notes | Out-File -FilePath release-notes.md -Encoding utf8 -NoNewline
          gh release edit $tag --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: CREBLOX-${{ env.CREBLOX_VERSION }}-windows-x64
          path: CREBLOX-${{ env.CREBLOX_VERSION }}-windows-x64.zip
          if-no-files-found: error
