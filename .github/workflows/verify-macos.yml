name: verify-macos

# Apple's `ld` is the only linker that proves a macOS release links: `cargo check` on Linux
# cannot see `_dispatch_get_main_queue`-style failures. This builds the shipping binary with
# the same deployment target as `scripts/build-macos-app.sh`, on Apple's runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest is arm64; the release binary is Intel (Catalina 10.15+).
          # Apple's ld can cross-link x86_64 from an arm64 runner, so this still
          # proves the exact target users install.
          targets: x86_64-apple-darwin
      - name: Build release for x86_64 with Apple's linker
        run: cargo build --release --locked --target x86_64-apple-darwin
