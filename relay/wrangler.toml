name = "creblox-party"
main = "src/index.js"
compatibility_date = "2024-11-01"

# One Durable Object class, addressed by party code. Nothing else is needed: no D1, no KV,
# no R2, no secrets. Deploy with `npx wrangler deploy`.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]
